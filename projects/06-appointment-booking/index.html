<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حجز المواعيد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9; /* Light Blue */
            --bg: #f0f9ff;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .booking-container { background: var(--surface); border-radius: 20px; box-shadow: 0 20px 40px rgba(14, 165, 233, 0.1); display: flex; width: 100%; max-width: 1000px; overflow: hidden; }
        
        /* Provider Profile (Left side in LTR, Right side in RTL) */
        .profile-side { width: 350px; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; padding: 40px; text-align: center; }
        .profile-side img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.3); margin-bottom: 20px; }
        .profile-side h2 { font-size: 24px; margin-bottom: 5px; }
        .profile-side p { opacity: 0.9; margin-bottom: 30px; font-size: 14px; }
        .info-item { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 14px; text-align: right; background: rgba(0,0,0,0.1); padding: 10px 15px; border-radius: 8px; }
        
        /* Calendar/Booking Side */
        .calendar-side { flex: 1; padding: 40px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .calendar-header h3 { font-size: 20px; }
        .nav-btn { background: none; border: 1px solid #e2e8f0; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; color: var(--text); }
        
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; margin-bottom: 30px; }
        .day-name { font-weight: 600; color: var(--text-light); font-size: 14px; margin-bottom: 10px; }
        .day-date { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin: auto; border-radius: 50%; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .day-date:hover { background: #e0f2fe; color: var(--primary); }
        .day-date.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.4); }
        .day-date.disabled { color: #cbd5e1; cursor: not-allowed; }
        
        /* Time Slots */
        .time-slots { margin-top: 20px; }
        .time-slots h4 { margin-bottom: 15px; color: var(--text); }
        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .slot { border: 1px solid var(--primary); color: var(--primary); background: transparent; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; text-align: center; }
        .slot:hover { background: var(--primary); color: white; }
        
        .book-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; margin-top: 30px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); transition: 0.3s; }
        .book-btn:hover { transform: translateY(-2px); }

        .back-btn { position: fixed; bottom: 20px; left: 20px; background: var(--text); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="booking-container">
        <!-- Provider Info -->
        <div class="profile-side">
            <img src="https://i.pravatar.cc/150?img=33" alt="Doctor">
            <h2>د. محمد الهاشمي</h2>
            <p>استشاري طب وجراحة العيون</p>
            
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i> العيادة التخصصية، شارع النور، الرياض
            </div>
            <div class="info-item">
                <i class="fa-solid fa-money-bill-wave"></i> سعر الكشف: 250 ريال
            </div>
            <div class="info-item">
                <i class="fa-regular fa-clock"></i> مدة الموعد: 30 دقيقة
            </div>
        </div>

        <!-- Booking Calendar -->
        <div class="calendar-side">
            <div class="calendar-header">
                <button class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
                <h3>يونيو 2026</h3>
                <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
            </div>
            
            <div class="days-grid">
                <div><div class="day-name">الأحد</div><div class="day-date disabled">10</div></div>
                <div><div class="day-name">الإثنين</div><div class="day-date disabled">11</div></div>
                <div><div class="day-name">الثلاثاء</div><div class="day-date active">12</div></div>
                <div><div class="day-name">الأربعاء</div><div class="day-date">13</div></div>
                <div><div class="day-name">الخميس</div><div class="day-date">14</div></div>
                <div><div class="day-name">الجمعة</div><div class="day-date disabled">15</div></div>
                <div><div class="day-name">السبت</div><div class="day-date disabled">16</div></div>
            </div>

            <div class="time-slots">
                <h4>المواعيد المتاحة (يوم الثلاثاء)</h4>
                <div class="slots-grid">
                    <button class="slot">10:00 صباحاً</button>
                    <button class="slot" style="background: #e2e8f0; border-color: #cbd5e1; color: #94a3b8; cursor: not-allowed;">10:30 صباحاً</button>
                    <button class="slot">11:00 صباحاً</button>
                    <button class="slot">12:30 مساءً</button>
                    <button class="slot">04:00 مساءً</button>
                    <button class="slot">04:30 مساءً</button>
                </div>
            </div>

            <button class="book-btn">تأكيد الحجز</button>
        </div>
    </div>

    <a href="../../index.html" class="back-btn">العودة للبرتفوليو <i class="fa-solid fa-arrow-left"></i></a>
</body>
</html>
